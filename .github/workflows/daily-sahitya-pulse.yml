name: Daily Sahitya Pulse & Automated Build Check

on:
  schedule:
    # Runs at 00:00 UTC every day throughout 2026, 2027, and all coming years!
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pulse:
    name: Auto-Verify & Daily Sahitya Rotation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Production Build
        run: npm run build

      - name: Record Daily Literary Heartbeat
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          CURRENT_YEAR=$(date -u +"%Y")
          echo "✦ Daily Sahitya Rotation Check for $CURRENT_DATE (Year: $CURRENT_YEAR)"
          echo "Status: Build verified, Daily Poem rotation active."
